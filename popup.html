<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Artigo Falado</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <h1>Artigo Falado</h1>
  <button id="ler">Ler página</button>
  <p id="status" role="status"></p>
  <label for="texto">Texto do artigo</label>
  <textarea id="texto" readonly aria-describedby="orientacao" placeholder="O texto capturado aparecerá aqui."></textarea>
  <p id="orientacao">Confira o texto e clique em Ouvir. A leitura continua quando você fecha este popup.</p>

  <div class="controles" role="group" aria-label="Controles de leitura">
    <button id="ouvir" disabled>Ouvir</button>
    <button id="pausar" disabled>Pausar</button>
    <button id="continuar" disabled>Continuar</button>
    <button id="parar" disabled>Parar</button>
  </div>
  <p id="estado-leitura" role="status">Consultando leitura…</p>
  <script src="popup.js"></script>
  <script src="controles.js"></script>
</body>
</html>
