<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Artigo Falado</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <h1>Artigo Falado</h1>
  <button id="ler">Ler página</button>
  <p id="status" role="status"></p>
  <label for="texto">Texto do artigo</label>
  <textarea id="texto" readonly aria-describedby="orientacao" placeholder="O texto capturado aparecerá aqui."></textarea>
  <p id="orientacao">Confira o texto e clique em Ouvir. A leitura continua quando você fecha este popup.</p>

  <div class="opcoes-voz">
    <div>
      <label for="voz">Voz</label>
      <select id="voz" aria-describedby="aviso-voz" disabled><option value="">Padrão do navegador</option></select>
    </div>
    <div>
      <label for="velocidade">Velocidade</label>
      <select id="velocidade" disabled>
        <option value="0.5">0,5×</option><option value="0.75">0,75×</option>
        <option value="1" selected>1×</option><option value="1.25">1,25×</option>
        <option value="1.5">1,5×</option><option value="2">2×</option>
      </select>
    </div>
  </div>
  <p id="aviso-voz" role="status"></p>
  <label id="texto-progresso" for="progresso">Nenhuma leitura em andamento.</label>
  <progress id="progresso" max="1" value="0"></progress>
  <div class="controles" role="group" aria-label="Controles de leitura">
    <button id="ouvir" disabled>Ouvir</button>
    <button id="pausar" disabled>Pausar</button>
    <button id="continuar" disabled>Continuar</button>
    <button id="parar" disabled>Parar</button>
  </div>
  <p id="estado-leitura" role="status">Consultando leitura…</p>
  <script src="popup.js"></script>
  <script src="controles.js"></script>
</body>
</html>
